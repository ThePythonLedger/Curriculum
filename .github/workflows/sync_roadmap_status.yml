name: Sync Roadmap Status

on:
  issues:
    types: [assigned, unassigned, closed, reopened]
  # pull_request_target (not pull_request) so the workflow gets write
  # access even for PRs opened from forks. Safe here because we never
  # check out or run the fork's code — we only read the PR body
  # (already in the event payload) and write to ROADMAP.md on main.
  pull_request_target:
    types: [opened, ready_for_review, closed]
